<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Training Simulator: Expert Mode</title>
    <style>
        :root {
            --bg-color: #050a14;
            --panel-bg: #0a1120;
            --text-main: #e0f2ff;
            --accent-red: #ff3333;
            --accent-green: #33ff33;
            --accent-blue: #33ccff;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        /* --- Header --- */
        header {
            height: 8vh;
            padding: 0 2vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(10, 17, 32, 0.9);
            z-index: 20;
        }

        h1 {
            font-size: 2.2vh;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-blue);
            text-shadow: 0 0 10px rgba(51, 204, 255, 0.4);
            display: flex;
            flex-direction: column;
        }
        
        h1 span {
            font-size: 1vh;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* --- Toolbar --- */
        .toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button, select {
            background: rgba(51, 204, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 1.4vh;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            outline: none;
        }

        button:hover, select:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 15px var(--accent-blue);
        }

        select option {
            background: var(--bg-color);
            color: var(--text-main);
        }
        
        .label-text {
            font-size: 1.2vh;
            color: rgba(255,255,255,0.5);
            margin-right: 5px;
        }

        .stat-box {
            font-family: var(--font-mono);
            font-size: 2vh;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 140px;
            text-align: right;
        }

        #lossValue { transition: color 0.2s; }

        /* --- Main Visualization Area --- */
        #viz-wrapper {
            flex: 1; 
            display: flex;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* Left: The Wave Matching */
        #wave-container {
            flex: 3; 
            position: relative;
            background: #050a14; 
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        /* Right: The Loss History */
        #history-container {
            flex: 1;
            position: relative;
            background: #080d19;
            display: flex;
            flex-direction: column;
        }
        
        .panel-label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: var(--font-mono);
            font-size: 1.2vh;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 5;
            background: rgba(5, 10, 20, 0.8);
            padding: 2px 5px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- Controls Area --- */
        #controls-area {
            height: 28vh;
            background: var(--panel-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            overflow-x: auto;
            gap: 3vw;
            padding: 0 2vw;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        /* --- The Dial Component --- */
        .dial-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            position: relative;
            flex-shrink: 0;
            width: 12vh;
        }

        .dial-label {
            font-family: var(--font-mono);
            font-size: 1.2vh;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }

        .dial-container {
            width: 10vh;
            height: 10vh;
            border-radius: 50%;
            position: relative;
            cursor: ns-resize; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.1);
            transition: border-color 0.2s;
        }

        .dial-container:hover {
            border-color: rgba(255,255,255,0.4);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.1);
        }

        .dial-rotator {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            transition: transform 0.05s linear; 
        }

        .dial-arrow {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 5px currentColor);
        }

        .dial-value {
            font-family: var(--font-mono);
            font-size: 1.5vh;
            font-weight: bold;
        }

        /* Success Overlay */
        #success-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5vh;
            font-weight: bold;
            color: var(--accent-green);
            text-shadow: 0 0 30px var(--accent-green);
            display: none;
            pointer-events: none;
            z-index: 100;
            background: rgba(0,0,0,0.9);
            padding: 20px 40px;
            border: 2px solid var(--accent-green);
            text-align: center;
            white-space: nowrap;
        }
        
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(51, 255, 51, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(51, 255, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(51, 255, 51, 0); }
        }

    </style>
</head>
<body>

<header>
    <h1>
        Neural Simulator
        <span>Backpropagation Visualizer</span>
    </h1>
    
    <div class="toolbar">
        <div class="stat-box">RMSE: <span id="lossValue">1.000</span></div>
        
        <div>
            <span class="label-text">DIALS:</span>
            <select id="levelSelect" onchange="changeSettings()">
                <option value="2">2 Params</option>
                <option value="3" selected>3 Params</option>
                <option value="5">5 Params</option>
                <option value="10">10 Params</option>
            </select>
        </div>

        <div>
            <span class="label-text">SAMPLES:</span>
            <select id="batchSelect" onchange="changeSettings()">
                <option value="1" selected>1 Graph (Standard)</option>
                <option value="2">2 Graphs (Training)</option>
                <option value="4">4 Graphs (Expert)</option>
                <option value="9">9 Graphs (Deep Learning)</option>
            </select>
        </div>

        <button onclick="resetPuzzle()">New Data</button>
        <button onclick="autoSolve()">Auto-Descend</button>
    </div>
</header>

<div id="viz-wrapper">
    <!-- Left: Wave -->
    <div id="wave-container">
        <div class="panel-label" id="gridLabel">BATCH VIEW</div>
        <canvas id="waveCanvas"></canvas>
        <div id="success-msg">GLOBAL MINIMA FOUND</div>
    </div>
    
    <!-- Right: Loss History -->
    <div id="history-container">
        <div class="panel-label">LOSS HISTORY (RMSE)</div>
        <canvas id="lossCanvas"></canvas>
    </div>
</div>

<div id="controls-area">
    <!-- Dials injected here by JS -->
</div>

<script>
    /**
     * STATE MANAGEMENT
     */
    let NUM_DIALS = 3;
    let BATCH_SIZE = 1;
    
    // Core Data
    let TARGET_WEIGHTS = [];    
    let CURRENT_WEIGHTS = [];   
    let INPUT_SEEDS = [];       
    
    let DIAL_INSTANCES = [];
    
    // History graph data
    let historyData = [];
    const MAX_HISTORY = 500; // Increased to handle long animation

    // Canvases
    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');
    const lossCanvas = document.getElementById('lossCanvas');
    const lossCtx = lossCanvas.getContext('2d');

    /**
     * INITIALIZATION
     */
    function init() {
        resizeCanvases();
        changeSettings(); 
    }

    function changeSettings() {
        const levelSel = document.getElementById('levelSelect');
        const batchSel = document.getElementById('batchSelect');
        
        NUM_DIALS = parseInt(levelSel.value);
        BATCH_SIZE = parseInt(batchSel.value);
        
        document.getElementById('gridLabel').innerText = BATCH_SIZE === 1 ? "SINGLE SAMPLE VIEW" : `BATCH VIEW (${BATCH_SIZE} SAMPLES)`;

        resetPuzzle(true); 
        buildDials();
        updateSimulation();
    }

    function resetPuzzle(skipDialUpdate = false) {
        TARGET_WEIGHTS = Array.from({length: NUM_DIALS}, () => (Math.random() * 2 - 1));
        INPUT_SEEDS = Array.from({length: BATCH_SIZE}, () => Math.random() * 10);
        CURRENT_WEIGHTS = Array.from({length: NUM_DIALS}, () => (Math.random() * 0.4 - 0.2));
        
        historyData = new Array(MAX_HISTORY).fill(null);
        
        if (!skipDialUpdate) {
            DIAL_INSTANCES.forEach((d, i) => {
                if(d && typeof CURRENT_WEIGHTS[i] !== 'undefined') {
                    d.setValue(CURRENT_WEIGHTS[i]);
                }
            });
            updateSimulation();
        }
        
        document.getElementById('success-msg').style.display = 'none';
        if(solveAnimFrame) cancelAnimationFrame(solveAnimFrame);
    }

    /**
     * DIAL CREATION & LOGIC
     */
    function buildDials() {
        const container = document.getElementById('controls-area');
        container.innerHTML = ''; 
        DIAL_INSTANCES = [];

        for (let i = 0; i < NUM_DIALS; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'dial-wrapper';
            
            wrapper.innerHTML = `
                <div class="dial-label">PARAM ${i+1}</div>
                <div class="dial-container" id="dial-${i}">
                    <div class="dial-rotator">
                        <svg class="dial-arrow" viewBox="0 0 100 100" fill="none">
                            <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2" opacity="0.5"/>
                            <circle cx="50" cy="50" r="30" stroke="currentColor" stroke-width="1" opacity="0.3"/>
                            <path d="M50 20 L65 50 L50 45 L35 50 Z" fill="currentColor" />
                        </svg>
                    </div>
                </div>
                <div class="dial-value" id="val-${i}">0.00</div>
            `;
            
            container.appendChild(wrapper);

            const dialObj = new Dial(`dial-${i}`, `val-${i}`, i);
            const initialVal = (CURRENT_WEIGHTS[i] !== undefined) ? CURRENT_WEIGHTS[i] : 0;
            dialObj.setValue(initialVal);
            
            DIAL_INSTANCES.push(dialObj);
        }
    }

    class Dial {
        constructor(elementId, valueId, index) {
            this.el = document.getElementById(elementId);
            this.valEl = document.getElementById(valueId);
            this.rotator = this.el.querySelector('.dial-rotator');
            this.arrow = this.el.querySelector('.dial-arrow');
            this.index = index;
            
            this.isDragging = false;
            this.lastY = 0;
            this.value = 0;

            this.el.addEventListener('mousedown', (e) => this.startDrag(e));
            window.addEventListener('mousemove', (e) => this.drag(e));
            window.addEventListener('mouseup', () => this.stopDrag());
            
            this.el.addEventListener('touchstart', (e) => this.startDrag(e.touches[0]));
            window.addEventListener('touchmove', (e) => this.drag(e.touches[0]));
            window.addEventListener('touchend', () => this.stopDrag());
        }

        startDrag(e) {
            this.isDragging = true;
            this.lastY = e.clientY;
            document.body.style.cursor = 'ns-resize';
            if(solveAnimFrame) cancelAnimationFrame(solveAnimFrame); 
        }

        drag(e) {
            if (!this.isDragging) return;
            const deltaY = this.lastY - e.clientY;
            this.lastY = e.clientY;

            let newVal = this.value + (deltaY * 0.005);
            this.setValue(newVal);
            
            if(CURRENT_WEIGHTS.length > this.index) {
                CURRENT_WEIGHTS[this.index] = this.value;
            }
            updateSimulation();
        }

        stopDrag() {
            this.isDragging = false;
            document.body.style.cursor = 'default';
        }

        setValue(val) {
            if (val === undefined || val === null || isNaN(val)) val = 0;
            if (val > 1) val = 1;
            if (val < -1) val = -1;
            this.value = val;
            
            if(CURRENT_WEIGHTS.length > this.index) {
                CURRENT_WEIGHTS[this.index] = val;
            }

            if(this.valEl) {
                this.valEl.innerText = (val > 0 ? '+' : '') + val.toFixed(3);
                const color = getColorForValue(val);
                this.arrow.style.color = color;
                this.valEl.style.color = color;
                this.el.style.borderColor = color;
                const angle = val * 135; 
                this.rotator.style.transform = `rotate(${angle}deg)`;
            }
        }
    }

    function getColorForValue(val) {
        let r, g, b;
        if (val < 0) {
            const ratio = Math.abs(val);
            r = Math.round(51 + (204 * ratio)); 
            g = Math.round(204 - (153 * ratio)); 
            b = Math.round(255 - (204 * ratio)); 
        } else {
            const ratio = val;
            r = 51; 
            g = Math.round(204 + (51 * ratio)); 
            b = Math.round(255 - (204 * ratio)); 
        }
        return `rgb(${r}, ${g}, ${b})`;
    }

    /**
     * MATH SIMULATION & GRID LOGIC
     */
    function getCurveY(x, weights, seedOffset) {
        let y = 0;
        const normWeights = weights.length || 1;
        
        for(let i=0; i<weights.length; i++) {
            const freq = 2 + i + (seedOffset % 3); 
            const phase = i + seedOffset;
            
            if (i % 2 === 0) {
                y += Math.sin(x * freq + phase) * weights[i];
            } else {
                y += Math.cos(x * freq + phase) * weights[i];
            }
        }
        return y / normWeights; 
    }

    function updateSimulation() {
        const w = waveCanvas.width;
        const h = waveCanvas.height;
        waveCtx.clearRect(0, 0, w, h);
        
        // Grid Layout
        let cols = 1;
        let rows = 1;
        if (BATCH_SIZE === 2) { cols = 2; rows = 1; }
        else if (BATCH_SIZE === 4) { cols = 2; rows = 2; }
        else if (BATCH_SIZE === 9) { cols = 3; rows = 3; }

        const cellW = w / cols;
        const cellH = h / rows;
        
        let batchTotalError = 0;
        let samplesCounted = 0;

        for (let i = 0; i < BATCH_SIZE; i++) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const xOff = col * cellW;
            const yOff = row * cellH;
            
            // Pass full cell dimensions, margin handles inside drawSubGraph
            const sampleError = drawSubGraph(waveCtx, xOff, yOff, cellW, cellH, INPUT_SEEDS[i]);
            
            batchTotalError += sampleError;
            samplesCounted++;
        }

        const rmse = Math.sqrt(batchTotalError / samplesCounted);
        const displayLoss = rmse.toFixed(4);

        const lossEl = document.getElementById('lossValue');
        lossEl.innerText = displayLoss;

        if (rmse < 0.05) { 
            lossEl.style.color = '#33ff33';
            document.getElementById('success-msg').style.display = 'block';
            document.getElementById('success-msg').classList.add('pulse');
        } else {
            lossEl.style.color = rmse > 0.2 ? '#ff3333' : '#ffffff';
            document.getElementById('success-msg').style.display = 'none';
            document.getElementById('success-msg').classList.remove('pulse');
        }
        
        // Throttle history updates slightly if animating fast, but generally push
        historyData.push(rmse);
        if (historyData.length > MAX_HISTORY) historyData.shift();
        drawHistoryGraph();
    }

    function drawSubGraph(ctx, x, y, w, h, seed) {
        // Margin Logic
        const margin = 10; 
        const graphX = x + margin;
        const graphY = y + margin;
        const graphW = w - (margin * 2);
        const graphH = h - (margin * 2);

        // Draw "Card" Background
        ctx.fillStyle = 'rgba(15, 27, 45, 0.7)';
        ctx.fillRect(graphX, graphY, graphW, graphH);
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.strokeRect(graphX, graphY, graphW, graphH);

        // Plotting
        const centerY = graphY + (graphH/2);
        const scaleY = (graphH * 0.35); 
        
        const step = 3; 
        let subError = 0;
        let count = 0;
        let points = [];

        for (let px = 0; px <= graphW; px += step) {
            const xNorm = (px / graphW) * Math.PI * 2;
            
            const targetY = getCurveY(xNorm, TARGET_WEIGHTS, seed);
            const predY = getCurveY(xNorm, CURRENT_WEIGHTS, seed);
            
            const err = Math.pow(targetY - predY, 2);
            subError += err;
            count++;

            points.push({
                x: graphX + px,
                tY: centerY - (targetY * scaleY),
                pY: centerY - (predY * scaleY)
            });
        }
        
        const mse = subError / count;

        // 1. Draw Error Fill
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 50, 50, ${Math.min(0.6, mse * 3)})`;
        
        ctx.save();
        ctx.beginPath();
        ctx.rect(graphX, graphY, graphW, graphH);
        ctx.clip();
        
        ctx.beginPath();
        points.forEach((p, i) => {
            if(i===0) ctx.moveTo(p.x, p.tY);
            else ctx.lineTo(p.x, p.tY);
        });
        for (let i = points.length - 1; i >= 0; i--) {
            ctx.lineTo(points[i].x, points[i].pY);
        }
        ctx.closePath();
        ctx.fill();

        // 2. Draw Target
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = BATCH_SIZE > 4 ? 1 : 2; 
        ctx.setLineDash([4, 4]);
        points.forEach((p, i) => {
            if(i===0) ctx.moveTo(p.x, p.tY);
            else ctx.lineTo(p.x, p.tY);
        });
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. Draw Prediction
        ctx.beginPath();
        let r = Math.min(255, mse * 800); 
        let g = Math.max(50, 255 - (mse * 800));
        ctx.strokeStyle = `rgb(${r}, ${g}, 255)`;
        ctx.lineWidth = BATCH_SIZE > 4 ? 2 : 3;
        
        points.forEach((p, i) => {
            if(i===0) ctx.moveTo(p.x, p.pY);
            else ctx.lineTo(p.x, p.pY);
        });
        ctx.stroke();

        ctx.restore(); 

        return mse; 
    }

    function drawHistoryGraph() {
        const w = lossCanvas.width;
        const h = lossCanvas.height;
        lossCtx.clearRect(0, 0, w, h);

        lossCtx.strokeStyle = 'rgba(255,255,255,0.05)';
        lossCtx.lineWidth = 1;
        lossCtx.beginPath();
        for(let i=0; i<h; i+=20) { lossCtx.moveTo(0, i); lossCtx.lineTo(w, i); }
        for(let i=0; i<w; i+=20) { lossCtx.moveTo(i, 0); lossCtx.lineTo(i, h); }
        lossCtx.stroke();

        if (historyData.length < 2) return;

        lossCtx.beginPath();
        lossCtx.lineWidth = 2;
        lossCtx.strokeStyle = '#ffcc00'; 
        
        const stepX = w / (MAX_HISTORY - 1);
        let maxVal = 0.5; 
        historyData.forEach(v => { if(v && v > maxVal) maxVal = v; });
        
        for (let i = 0; i < historyData.length; i++) {
            const val = historyData[i];
            if (val === null) continue;
            const x = i * stepX;
            const y = h - ( (val / maxVal) * (h - 20) ) - 10;
            if (i === 0) lossCtx.moveTo(x, y);
            else lossCtx.lineTo(x, y);
        }
        lossCtx.stroke();
    }

    /**
     * AUTO SOLVE ANIMATION (Stochastic Gradient Descent Sim)
     */
    let solveAnimFrame;
    function autoSolve() {
        if(solveAnimFrame) cancelAnimationFrame(solveAnimFrame);
        
        const startTime = Date.now();
        const duration = 12000; // 12 seconds
        const startValues = [...CURRENT_WEIGHTS];
        
        function step() {
            const now = Date.now();
            let progress = (now - startTime) / duration;
            
            if (progress >= 1) {
                progress = 1;
                // Snap to exact target at end
                for(let i=0; i<NUM_DIALS; i++) {
                     if (DIAL_INSTANCES[i]) DIAL_INSTANCES[i].setValue(TARGET_WEIGHTS[i]);
                }
                updateSimulation();
                return; // Stop
            }
            
            // 1. General Trend (Ease Out Cubic) - Moves fast initially, slows down
            const trend = 1 - Math.pow(1 - progress, 3);
            
            // 2. Stochastic Noise (Simulated Annealing)
            // High noise at start, decreasing to near zero at end
            const noiseAmplitude = (1 - progress) * 0.4; 
            
            for(let i=0; i<NUM_DIALS; i++) {
                if (DIAL_INSTANCES[i]) {
                    const start = startValues[i];
                    const target = TARGET_WEIGHTS[i];
                    
                    // Ideal Path
                    const idealVal = start + (target - start) * trend;
                    
                    // Add oscillation (Ups and downs)
                    // Use sin wave + distinct offset per dial so they don't sync perfectly
                    const oscillation = Math.sin((progress * 30) + (i * 1.5));
                    
                    // Apply Noise
                    const noise = oscillation * noiseAmplitude;
                    
                    DIAL_INSTANCES[i].setValue(idealVal + noise);
                }
            }
            
            updateSimulation();
            solveAnimFrame = requestAnimationFrame(step);
        }
        step();
    }

    function resizeCanvases() {
        const wCont = document.getElementById('wave-container');
        if(wCont) {
            waveCanvas.width = wCont.clientWidth;
            waveCanvas.height = wCont.clientHeight;
        }
        const hCont = document.getElementById('history-container');
        if(hCont) {
            lossCanvas.width = hCont.clientWidth;
            lossCanvas.height = hCont.clientHeight;
        }
        updateSimulation();
    }

    window.addEventListener('resize', resizeCanvases);

    init();

</script>
</body>
</html>
