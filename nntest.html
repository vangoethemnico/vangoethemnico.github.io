        document.getElementById('btnSave').addEventListener('click', () => this.saveModel());
        document.getElementById('fileInput').addEventListener('change', (e) => this.loadModel(e));
        
        // Weight Map Interaction
        const netCanvas = document.getElementById('networkCanvas');
        netCanvas.addEventListener('click', (e) => this.handleNodeClick(e, netCanvas));
        
        // Weight Map Hover
        const wMapCanvas = document.getElementById('weightMapCanvas');
        wMapCanvas.addEventListener('mousemove', (e) => this.handleWeightMapHover(e));
        wMapCanvas.addEventListener('mouseleave', () => {
             // Reset highlight
             this.highlightedConnection = null;
             // We can reset label text if we want, but keeping "Node L..." is fine. 
             // Maybe reset the added value text.
             if(this.selectedNode) {
                 const label = document.getElementById('weightMapLabel');
                 // Revert to original text without value
                 // Helper to reconstruct label
                 const which = this.selectedNode.layerIndex === 1 ? "(Spatial)" : "(Flat)";
                 label.textContent = `Node L${this.selectedNode.layerIndex} #${this.selectedNode.nodeIndex} ${which}`;
             }
             this.renderNetworkGraph(document.getElementById('networkCanvas'));
        });

        // Tab 3: Drawing
        this.setupDrawingCanvas();

        document.getElementById('btnRandomTest').addEventListener('click', () => {
            const shapes = ['triangle', 'square', 'circle'];
            const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
            
            // Generate onto DataGen.canvas (30x30)
            const generated = DataGen.generateImage(randomShape);
            
            // Draw scaled up to 300x300
            const drawCanvas = document.getElementById('drawCanvas');
            const ctx = drawCanvas.getContext('2d');
            
            // Run Inference on generated.input
            const output = this.nn.feedForward(generated.input);
            
            // Determine Prediction
            let maxVal = -1;
            let maxIdx = -1;
            for(let i=0; i<output.length; i++) {
                if(output[i] > maxVal) {
                    maxVal = output[i];
                    maxIdx = i;
                }
            }
            const predLabel = ['triangle','square','circle'][maxIdx];
            const isCorrect = (predLabel === randomShape);
            
            // Draw original (black/white)
            ctx.imageSmoothingEnabled = false; 
            ctx.drawImage(DataGen.canvas, 0, 0, 300, 300);
            
            // Explicitly Update Small Input Canvas (since Static Eval is ON)
            const inputCanvas = document.getElementById('inputCanvas');
            const inputCtx = inputCanvas.getContext('2d');
            inputCtx.clearRect(0,0,30,30);
            inputCtx.drawImage(DataGen.canvas, 0, 0);

            // Set Border Color
            drawCanvas.style.border = isCorrect ? '5px solid #2e7d32' : '5px solid #d32f2f'; // Green / Red (Accent vs Error)

            // Set Static Flag so loop doesn't overwrite
            this.isStaticEval = true;
            this.renderNetworkGraph(document.getElementById('liveNetworkCanvas'), output);
        });

        document.getElementById('btnFault').addEventListener('click', () => {
             // Adversarial / Tricking Generator (Gradient Ascent on Input)
             // Force the network to see a specific shape in noise
             
             // 1. Pick a random target class (0=triangle, 1=square, 2=circle)
             const targetIdx = Math.floor(Math.random() * 3);
             const targetLabel = ['triangle','square','circle'][targetIdx];
             const target = [0,0,0]; 
             target[targetIdx] = 1;

             // 2. Start with random noise
             let input = new Array(900).fill(0).map(() => Math.random());
             
             // 3. Gradient Ascent Loop
             const lr = 0.8; // Aggressive learning rate
             const iterations = 200; 

             for(let k=0; k<iterations; k++) {
                 // Forward Pass
                 const outputs = this.nn.feedForward(input); // Updates this.nn.layerActivations
                 
                 // Stop if we are super confident
                 if(outputs[targetIdx] > 0.999) break;

                 // Backpropagate to Model Input
                 // We want to maximize Target Output. ErrorGradient = (Target - Output)
                 // Or rather, we use the derivative of the Cost function.
                 
                 // Step A: Output Deltas
                 // delta_L = (t - y) * y * (1-y)
                 let layerIdx = this.nn.layerActivations.length - 1;
                 let outputLayer = this.nn.layerActivations[layerIdx].data; // Matrix data [3][1]
                 
                 let currentDelta = [];
                 for(let i=0; i<outputLayer.length; i++) {
                     let o = outputLayer[i][0];
                     let t = target[i];
                     let err = t - o; 
                     let d = err * (o * (1 - o)); // dSigmoid
                     currentDelta.push(d);
                 }
                 
                 // Step B: Propagate backwards to Input
                 for(let i = this.nn.weights.length - 1; i >= 0; i--) {
                     let weights = this.nn.weights[i]; // Matrix [curr][prev]
                     let prevActivations = this.nn.layerActivations[i]; // Matrix [prev][1]
                     
                     let nextDelta = new Array(weights.cols).fill(0);
                     
                     for(let c=0; c<weights.cols; c++) {
                         let sum = 0;
                         // W^T * delta
                         for(let r=0; r<weights.rows; r++) {
                             sum += weights.data[r][c] * currentDelta[r];
                         }
                         
                         if(i > 0) {
                             // Apply derivative of previous layer activation
                             let a = prevActivations.data[c][0];
                             nextDelta[c] = sum * (a * (1 - a));
                         } else {
                             // i==0. prevActivations is Input. It has no sigmoid.
                             // The gradient at input is just the sum.
                             nextDelta[c] = sum;
                         }
                     }
                     currentDelta = nextDelta;
                 }
                 
                 // Step C: Update Input
                 // currentDelta is now the gradient of the Error w.r.t the Input
                 // We add it to climb the hill (maximize confidence matching target)
                 for(let i=0; i<900; i++) {
                     input[i] += currentDelta[i] * lr;
                     // Clamp to valid 0-1 range to keep image valid
                     input[i] = Math.max(0, Math.min(1, input[i]));
                 }
             }

             // 4. Render result
             const drawCanvas = document.getElementById('drawCanvas');
             const ctx = drawCanvas.getContext('2d');
             
             // Render logic (1=Black, 0=White)
             DataGen.ctx.fillStyle = 'white';
             DataGen.ctx.fillRect(0,0,30,30);
             const id = DataGen.ctx.getImageData(0,0,30,30);
             
             for(let i=0; i<900; i++) {
                 const val = Math.floor((1 - input[i]) * 255);
                 const pIdx = i * 4;
                 id.data[pIdx] = val;
                 id.data[pIdx+1] = val;
                 id.data[pIdx+2] = val;
                 id.data[pIdx+3] = 255;
             }
             DataGen.ctx.putImageData(id, 0, 0);
             
             ctx.fillStyle = 'white';
             ctx.fillRect(0, 0, 300, 300);
             ctx.imageSmoothingEnabled = false; 
             ctx.drawImage(DataGen.canvas, 0, 0, 300, 300);
             
             // Run final inference to update UI stats
             const finalOut = this.nn.feedForward(input);
             // Trigger visualizer update
             this.renderNetworkGraph(document.getElementById('liveNetworkCanvas'), finalOut);
             
             // Unlock Loop so Input Canvas updates (and faults don't look 'stuck' if coming from Random Test)
             this.isStaticEval = false;

             console.log(`Fault Generated for ${targetLabel}. Confidence: ${finalOut[targetIdx].toFixed(4)}`);
        });
    },

    createNetwork() {
        const hiddenStr = document.getElementById('layerConfig').value;
        const hiddenLayers = hiddenStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        const structure = [900, ...hiddenLayers, 3];
        this.nn = new NeuralNetwork(structure);
        console.log("Network Created:", structure);
    },

    resetNetwork() {
        this.createNetwork();
        this.lossHistory = [];
        this.chart.data.labels = [];
        this.chart.data.datasets[0].data = [];
        this.chart.update();
        this.visualizerNodes = []; // Clear graph nodes
        this.selectedNode = null;
        this.highlightedConnection = null;
        this.renderNetworkGraph(document.getElementById('networkCanvas'));
        document.getElementById('trainStatus').textContent = "Status: Reset";
    },

    generateDataset() {
        const count = parseInt(document.getElementById('numSamples').value);
        const usePerfect = document.getElementById('togglePerfect').checked;
        const useHandDrawn = document.getElementById('toggleHandDrawn').checked;
        this.trainingData = [];
        
        ['triangle', 'square', 'circle'].forEach(shape => {
            const container = document.getElementById('grid' + shape.charAt(0).toUpperCase() + shape.slice(1));
            container.innerHTML = '';
            
            for(let i=0; i<count; i++) {
                // Determine style for this specific sample
                let isHandDrawn = false;
                if (usePerfect && useHandDrawn) {
                    isHandDrawn = Math.random() < 0.5;
                } else if (useHandDrawn) {
                    isHandDrawn = true;
                }
                
                const data = DataGen.generateImage(shape, isHandDrawn);
                this.trainingData.push(data);
                
                // Add to grid
                const div = document.createElement('div');
                div.className = 'grid-item';
                const img = new Image();
                img.src = data.imgSrc;
                img.width = 30;
                img.height = 30;
                img.style.border = '1px solid #ccc';
                
                // Add hover zoom listener
                img.addEventListener('mouseenter', (e) => {
                    const preview = document.getElementById('imagePreview');
                    preview.style.display = 'block';
                    preview.style.backgroundImage = `url(${data.imgSrc})`;
                    preview.style.backgroundSize = '100% 100%';
                    // Position nearby
                    preview.style.left = (e.clientX + 15) + 'px';
                    preview.style.top = (e.clientY + 15) + 'px';
                });
                img.addEventListener('mousemove', (e) => {
                    const preview = document.getElementById('imagePreview');
                    preview.style.left = (e.clientX + 15) + 'px';
                    preview.style.top = (e.clientY + 15) + 'px';
                });
                img.addEventListener('mouseleave', () => {
                    document.getElementById('imagePreview').style.display = 'none';
                });

                div.appendChild(img);
                container.appendChild(div);
            }
        });
        
        // Shuffle
        this.trainingData.sort(() => Math.random() - 0.5);
        document.getElementById('datasetStatus').textContent = `Dataset containing ${this.trainingData.length} images`;
        document.getElementById('datasetStatus').style.color = 'var(--accent)';
    },

    startTraining() {
        if(this.trainingData.length === 0) {
            alert("Please generate data first!");
            return;
        }
        
        this.isTraining = true;
        this.isPaused = false;
        document.getElementById('btnTrain').textContent = "Stop Training";
        document.getElementById('layerConfig').disabled = true;
        
        // Show Progress Bar and reset Pause button
        const progressContainer = document.getElementById('progressContainer');
        progressContainer.style.display = 'flex';
        const btnPause = document.getElementById('btnPause');
        
        // Use SVGs for Play/Pause
        const iconPause = '<svg width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        const iconPlay = '<svg width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
        
        btnPause.innerHTML = iconPause;
        
        btnPause.onclick = () => {
             this.isPaused = !this.isPaused;
             btnPause.innerHTML = this.isPaused ? iconPlay : iconPause;
             
             if (this.isPaused) {
                 this.pauseStartTime = Date.now();
             } else {
                 this.totalPausedTime += (Date.now() - this.pauseStartTime);
             }
        };

        this.nn.learningRate = parseFloat(document.getElementById('learningRate').value);
        const maxEpochs = parseInt(document.getElementById('maxEpochs').value);
        
        this.epoch = 0;
        let lastRenderTime = 0;
        const startTime = Date.now();
        this.totalPausedTime = 0;
        this.pauseStartTime = 0;
        
        const formatTime = (ms) => {
            if (!isFinite(ms) || ms < 0) return "--";
            const s = Math.floor(ms / 1000);
            if (s < 60) return s.toFixed(1) + "s";
            
            const m = Math.floor(s / 60);
            const remS = Math.floor(s % 60);
            if (m < 60) return `${m}m ${remS}s`;
            
            const h = Math.floor(m / 60);
            const remM = m % 60;
            return `${h}h ${remM}m ${remS}s`;
        };
        
        // Chunk Training State
        let trainIndex = 0; // Current index in trainingData for current epoch
        let epochLoss = 0;
        
        const loop = (timestamp) => {
            if(!this.isTraining) return;

            if (this.isPaused) {
                this.animationId = requestAnimationFrame(loop);
                return;
            }

            // 1. Training Logic (Chunked for responsiveness)
            const MAX_FRAME_TIME = 15; // ms budget for training per frame
            const frameStart = performance.now();
            let finishedEpoch = false;

            // Initialize epoch start if needed
            if (trainIndex === 0) {
                // Shuffle data at start of epoch
                this.trainingData.sort(() => Math.random() - 0.5);
            }

            // Process Batch
            while (performance.now() - frameStart < MAX_FRAME_TIME) {
                if (trainIndex >= this.trainingData.length) {
                    finishedEpoch = true;
                    break;
                }
                const data = this.trainingData[trainIndex];
                epochLoss += this.nn.train(data.input, data.target);
                trainIndex++;
            }

            // 2. Visual Updates (Prioritized: Run every frame if interval passed, even mid-epoch)
            const liveViz = document.getElementById('cbLiveVisuals').checked;
            const updateInterval = liveViz ? 100 : 500; 

            if(timestamp - lastRenderTime > updateInterval) {
                const now = Date.now();
                const elapsed = now - startTime - this.totalPausedTime;
                
                // Estimate progress
                // If we are mid-epoch, include the partial progress
                const partialEpoch = this.epoch + (trainIndex / this.trainingData.length);
                const progress = partialEpoch / maxEpochs;
                
                // Time calc
                let leftStr = "--";
                if (partialEpoch > 2 && progress > 0) { 
                    const totalEst = elapsed / progress;
                    const remaining = totalEst - elapsed;
                    leftStr = formatTime(remaining);
                }
                const elapsedStr = formatTime(elapsed);
                
                // Update UI Labels
                // Note: Average loss displayed will be from *previous* completed epoch until new one finishes
                // Or we can show current running loss? current running loss is unstable.
                // Let's show last known completed loss or "..."
                const displayLoss = (this.epoch > 0) ? (epochLoss / (trainIndex || 1)).toFixed(5) : "..."; // Temporary approximation or previous?
                // Better: keep the `avgLoss` from the last completed epoch in a variable if we want stability.
                // For now, let's just show standard info.
                
                document.getElementById('trainStatus').textContent = `Epoch: ${this.epoch} / ${maxEpochs} | Loss: ${displayLoss}`;
                document.getElementById('trainProgressBar').style.width = Math.min(progress * 100, 100) + "%";
                document.getElementById('timeElapsed').textContent = `Elapsed: ${elapsedStr}`;
                document.getElementById('timeLeft').textContent = `Left: ${leftStr}`;

                if (liveViz) {
                    // 1. Update Network Graph
                    if (this.nn.layerActivations && this.nn.layerActivations.length > 0) {
                         const lastLayerIdx = this.nn.layerActivations.length - 1;
                         const output = Matrix.toArray(this.nn.layerActivations[lastLayerIdx]);
                         this.renderNetworkGraph(document.getElementById('networkCanvas'), output);
                    }

                    // 2. Update Weight Map
                    if (this.selectedNode) {
                         const layerIdx = this.selectedNode.layerIndex;
                         const weightsMatrix = this.nn.weights[layerIdx - 1]; 
                         const newWeights = weightsMatrix.data[this.selectedNode.nodeIndex];
                         this.selectedNode.weights = newWeights; 
                         
                         const isImage = (layerIdx === 1);
                         this.drawWeightMap(newWeights, this.selectedNode, isImage);

                         if (this.highlightedConnection && this.highlightedConnection.sourceIndex !== undefined) {
                             const idx = this.highlightedConnection.sourceIndex;
                             if (newWeights[idx] !== undefined) {
                                 const val = newWeights[idx];
                                 const label = document.getElementById('weightMapLabel');
                                 const which = isImage ? "(Spatial)" : "(Flat)";
                                 label.textContent = `Node L${layerIdx} #${this.selectedNode.nodeIndex} ${which} | Val: ${val.toFixed(4)}`;
                                 this.drawWeightLegend(val);
                                 this.drawWeightDonut(val);
                             }
                         }
                    }
                }
                lastRenderTime = timestamp;
            }

            // 3. Epoch Completion Logic
            if(finishedEpoch) {
                const avgLoss = epochLoss / this.trainingData.length;
                this.updateChart(this.epoch + 1, avgLoss); // Chart uses 1-based epoch? or 0? 
                
                this.epoch++;
                trainIndex = 0;
                epochLoss = 0;

                if (this.epoch >= maxEpochs) {
                    this.stopTraining();
                    
                    // Final UI Update
                    const finalNow = Date.now();
                    const finalElapsed = finalNow - startTime - this.totalPausedTime;
                    document.getElementById('trainProgressBar').style.width = "100%";
                    document.getElementById('timeElapsed').textContent = `Elapsed: ${formatTime(finalElapsed)}`;
                    document.getElementById('timeLeft').textContent = "Left: 0.0s";
                    document.getElementById('trainStatus').textContent = `Done. Final Loss: ${avgLoss.toFixed(5)}`;
                    
                    if (this.nn.layerActivations && this.nn.layerActivations.length > 0) {
                         const output = Matrix.toArray(this.nn.layerActivations[this.nn.layerActivations.length - 1]);
                         this.renderNetworkGraph(document.getElementById('networkCanvas'), output);
                    }
                    return;
                }
            }

            // Continue loop
            this.animationId = requestAnimationFrame(loop);
        };
        // Use requestAnimationFrame to start and get timestamp
        this.animationId = requestAnimationFrame(loop);
    },

    stopTraining() {
        this.isTraining = false;
        document.getElementById('btnTrain').textContent = "Start Training";
        document.getElementById('progressContainer').style.display = 'none';
        document.getElementById('layerConfig').disabled = false;
        cancelAnimationFrame(this.animationId);
    },

    saveModel() {
        const modelData = {
            layerSizes: this.nn.layerSizes,
            weights: this.nn.weights.map(m => m.data),
            biases: this.nn.biases.map(m => m.data),
            learningRate: this.nn.learningRate,
            epoch: this.epoch || 0,
            maxEpochs: parseInt(document.getElementById('maxEpochs').value) || 200,
            lossHistory: this.lossHistory || []
        };
        
        const blob = new Blob([JSON.stringify(modelData)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `neural_network_model_E${modelData.epoch}.json`;
        a.click();
        URL.revokeObjectURL(url);
    },

    loadModel(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                
                // Validate basic structure
                if (!data.layerSizes || !data.weights || !data.biases) {
                    alert("Invalid model file");
                    return;
                }
                
                // Reconstruct Network
                // Updates the input text to match loaded layers
                const configStr = data.layerSizes.slice(1, -1).join(", ");
                document.getElementById('layerConfig').value = configStr;
                
                // Init new network structure
                this.nn = new NeuralNetwork(data.layerSizes);
                this.nn.learningRate = data.learningRate || 0.1;
                document.getElementById('learningRate').value = this.nn.learningRate;
                
                // Inject Weights
                for(let i=0; i < this.nn.weights.length; i++) {
                     const wMatrix = this.nn.weights[i];
                     const loadedData = data.weights[i];
                     // Copy data
                     wMatrix.data = loadedData;
                     // Verify dims
                     if (wMatrix.rows !== loadedData.length || wMatrix.cols !== loadedData[0].length) {
                         throw new Error("Weight matrix dimension mismatch");
                     }
                }
                
                // Inject Biases
                for(let i=0; i < this.nn.biases.length; i++) {
                     const bMatrix = this.nn.biases[i];
                     const loadedData = data.biases[i];
                     bMatrix.data = loadedData;
                }
                
                // Restore Training State
                if (data.epoch !== undefined) this.epoch = data.epoch;
                if (data.maxEpochs !== undefined) document.getElementById('maxEpochs').value = data.maxEpochs;
                
                // Restore Chart and History
                if (data.lossHistory) {
                    this.lossHistory = data.lossHistory;
                    this.chart.data.labels = this.lossHistory.map(h => h.x);
                    this.chart.data.datasets[0].data = this.lossHistory.map(h => h.y);
                    this.chart.update();
                    
                    if (this.lossHistory.length > 0) {
                        const last = this.lossHistory[this.lossHistory.length - 1];
                        document.getElementById('trainStatus').textContent = `Status: Model Loaded | Epoch: ${this.epoch} | Last Loss: ${last.y.toFixed(5)}`;
                    } else {
                        document.getElementById('trainStatus').textContent = "Status: Model Loaded (No history)";
                    }
                } else {
                    // Reset Chart
                    this.lossHistory = [];
                    this.chart.data.labels = [];
                    this.chart.data.datasets[0].data = [];
                    this.chart.update();
                    document.getElementById('trainStatus').textContent = "Status: Model Loaded";
                }

                // Reset Visuals
                this.renderNetworkGraph(document.getElementById('networkCanvas'));
                
            } catch (err) {
                console.error(err);
                alert("Error loading model: " + err.message);
            }
        };
        reader.readAsText(file);
        // Reset input so same file can be selected again
        e.target.value = '';
    },

    /**
     * VISUALIZATION LOGIC
     */
    resizeCanvas(id) {
        const cvs = document.getElementById(id);
        const parent = cvs.parentElement;
        cvs.width = parent.clientWidth;
        cvs.height = parent.clientHeight;
    },

    /**
     * UTILS
     */
    getWeightColor(weight) {
        // Red (-1) <-> Blue (0) <-> Green (1)
        // We clamp weight between -2 and 2 for color implementation to handle outliers
        const val = Math.max(-2, Math.min(2, weight));
        
        let r=0, g=0, b=0;
        
        // Using a more vibrant palette
        if (val < 0) {
            // Negative: Red (Trend towards Blue at 0)
            const t = Math.abs(val); 
            // Blend Blue(0,0,255) to Red(255,0,0)
            // Actually user wants Blue=Neutral. 
            // So 0 = Blue. -1 = Red. +1 = Green.
            
            // Interpolate Blue to Red
            // Blue: 0,0,255. Red: 255,0,0
            // t goes 0 -> 1
            r = Math.floor(255 * Math.min(1, t));
            b = Math.floor(255 * (1 - Math.min(1, t)));
            g = 0;
        } else {
            // Positive: Green (Trend towards Blue at 0)
            const t = val;
            // Interpolate Blue to Green
            // Blue: 0,0,255. Green: 0,255,0
            r = 0;
            g = Math.floor(255 * Math.min(1, t));
            b = Math.floor(255 * (1 - Math.min(1, t)));
        }

        return `rgb(${r},${g},${b})`;
    },

    renderNetworkGraph(canvas, predictions = null) {
        this.visualizerNodes = []; // Reset nodes for click detection
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0,0,w,h);
        
        const layers = this.nn.layerSizes; // e.g. [900, 24, 12, 3]
        const layerGap = (predictions) ? w / (layers.length + 0.5) : w / layers.length; // Add space for preds if present
        
        // Calculate node positions for all layers first
        const nodePositions = [];
        let highlightedData = null; // Store highlight for final draw
        
        for(let l = 0; l < layers.length; l++) {
            const count = layers[l];
            const x = (l * layerGap) + (layerGap / 2);
            /* Lines 1070-1110 omitted */
            const positions = [];
            
            if (l === 0) {
                // Input 30x30 Image Raster
                const side = 150; 
                const boxX = x - (side/2);
                const boxY = h/2 - (side/2);
                
                // Draw Label
                ctx.fillStyle = '#666';
                ctx.textAlign = 'center';
                ctx.fillText("Input 30x30", x, boxY - 10);
                
                // Draw Border
                ctx.strokeStyle = '#ccc';
                ctx.strokeRect(boxX, boxY, side, side);
                
                const cellS = side / 30;

                // Pre-calc 900 points
                for (let r=0; r<30; r++) {
                    for (let c=0; c<30; c++) {
                        positions.push({
                            x: boxX + (c * cellS) + (cellS/2), // Center for connections
                            y: boxY + (r * cellS) + (cellS/2),
                            rectX: boxX + (c * cellS),         // TopLeft for pixel draw
                            rectY: boxY + (r * cellS),
                            size: cellS
                        });
                    }
                }
            } else {
                // Standard Vertical Column Layout
                const maxNodes = 25; // Visualizing max 25 nodes
                const nodesToDraw = Math.min(count, maxNodes);
                const stepY = h / (nodesToDraw + 1);
                
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                const label = l === layers.length - 1 ? "Output" : `Hidden ${l}`;
                ctx.fillText(label, x, 20);

                for(let i = 0; i < nodesToDraw; i++) {
                    positions.push({
                        x: x,
                        y: (i + 1) * stepY,
                        actualIndex: i // Keep track if we clip
                    });
                }
            }
            nodePositions.push(positions);
        }

        this.visualizerNodes = []; // Reset click targets

        ctx.globalAlpha = 1.0;

        // DRAW INPUT RASTER (Layer 0)
        if (nodePositions[0] && this.nn.layerActivations && this.nn.layerActivations[0]) {
            const inputs = Matrix.toArray(this.nn.layerActivations[0]);
            const pts = nodePositions[0];
            const len = Math.min(inputs.length, pts.length);
            
            for(let i=0; i<len; i++) {
                const pt = pts[i];
                if (pt.rectX === undefined) continue;

                const val = inputs[i]; 
                // 1.0 = Black (Ink), 0.0 = White (Bg)
                const intensity = Math.floor((1 - val) * 255);
                ctx.fillStyle = `rgb(${intensity},${intensity},${intensity})`;
                ctx.fillRect(pt.rectX, pt.rectY, pt.size + 0.5, pt.size + 0.5);
            }
        }

        // DRAW CONNECTIONS
        for (let l = 0; l < layers.length - 1; l++) {
            const sourcePoints = nodePositions[l];
            const targetPoints = nodePositions[l+1];
            const weights = this.nn.weights[l]; 

            const isHeavyLayer = l === 0;

            for (let t = 0; t < targetPoints.length; t++) {
                const targetNode = targetPoints[t];
                
                for (let s = 0; s < sourcePoints.length; s++) {
                    const sourceNode = sourcePoints[s];
                    
                    const weightVal = weights.data[t][s];
                    const color = this.getWeightColor(weightVal);
                    
                    // Check if this connection is highlighted
                    let isHighlighted = false;
                    const isAnyHighlighted = !!this.highlightedConnection;

                    if (isAnyHighlighted && this.highlightedConnection.layerIndex === l + 1) {
                         const tIdx = (targetNode.actualIndex !== undefined) ? targetNode.actualIndex : t;
                         const sIdx = (sourceNode.actualIndex !== undefined) ? sourceNode.actualIndex : s;

                         if (tIdx === this.highlightedConnection.targetIndex && 
                             sIdx === this.highlightedConnection.sourceIndex) {
                             isHighlighted = true;
                             highlightedData = {
                                 sx: sourceNode.x, sy: sourceNode.y,
                                 tx: targetNode.x, ty: targetNode.y,
                                 color: color
                             };
                         }
                    }
                    
                    if (!isHighlighted && Math.abs(weightVal) < 0.05 && isHeavyLayer) continue;

                    const width = Math.min(3, Math.abs(weightVal) * (isHeavyLayer ? 0.5 : 2));
                    
                    ctx.beginPath();
                    ctx.moveTo(sourceNode.x, sourceNode.y);
                    ctx.lineTo(targetNode.x, targetNode.y);
                    
                    if (isHighlighted) {
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 4;
                        ctx.globalAlpha = 1.0;
                    } else if (isAnyHighlighted) {
                        ctx.strokeStyle = color; // Keep weight color even when faded
                        ctx.lineWidth = isHeavyLayer ? 0.5 : 1; 
                        ctx.globalAlpha = 0.1; // Very transparent but colored
                    } else {
                        ctx.strokeStyle = color;
                        ctx.lineWidth = isHeavyLayer ? 0.3 : width; 
                        // Reduced opacity by 50% to make the input raster more visible
                        ctx.globalAlpha = isHeavyLayer ? 0.1 : 0.3;
                    }
                    ctx.stroke();
                }
            }
        }
        
        // DRAW HIGHLIGHTED CONNECTION
        if (highlightedData) {
            ctx.beginPath();
            ctx.moveTo(highlightedData.sx, highlightedData.sy);
            ctx.lineTo(highlightedData.tx, highlightedData.ty);
            ctx.strokeStyle = highlightedData.color;
            ctx.lineWidth = 4;
            ctx.globalAlpha = 1.0;
            ctx.stroke();
        }

        ctx.globalAlpha = 1.0;

        // DRAW NODES & PREDICTIONS
        for (let l = 1; l < layers.length; l++) {
            const positions = nodePositions[l];
            const activations = (this.nn.layerActivations && this.nn.layerActivations[l]) 
                ? Matrix.toArray(this.nn.layerActivations[l]) 
                : null;

            for (let i = 0; i < positions.length; i++) {
                const node = positions[i];
                const actVal = activations ? activations[i] : 0;
                
                // Node Visualization
                ctx.beginPath();
                ctx.arc(node.x, node.y, 8, 0, Math.PI*2);
                
                const intensity = Math.floor(actVal * 255);
                ctx.fillStyle = `rgb(${255-intensity}, 255, ${255-intensity})`; 
                ctx.fill();
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.stroke();

                this.visualizerNodes.push({
                    layerIndex: l,
                    nodeIndex: i,
                    x: node.x,
                    y: node.y,
                    r: 8
                });
                
                // If this is the Output Layer AND we have predictions, draw result
                if (l === layers.length - 1 && predictions) {
                    const predVal = predictions[i]; // 0-1
                    // Scale everything up ~3x
                    const cx = node.x + 80; // Draw further to the right
                    const cy = node.y;
                    const r = 54; // 18 * 3
                    
                    // Donut Background
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI*2);
                    ctx.fillStyle = '#eee';
                    ctx.fill();
                    
                    // Donut Value (Arc)
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    // Start from top (-PI/2)
                    ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + (Math.PI*2 * predVal));
                    ctx.lineTo(cx, cy);
                    ctx.fillStyle = '#2e7d32'; // Accent green
                    ctx.fill();
                    
                    // Donut Hole (White Inner)
                    ctx.beginPath();
                    ctx.arc(cx, cy, r - 15, 0, Math.PI*2); // Thicker ring
                    ctx.fillStyle = '#ffffff'; // BG color
                    ctx.fill();
                    
                    // Draw Shape Icon in Center
                    ctx.fillStyle = '#333';
                    const iconSize = 24; // 8 * 3
                    ctx.beginPath();
                    if (i === 0) { // Triangle
                        // Draw triangle centered at cx, cy
                         const hOffset = iconSize/2;
                         const vOffset = iconSize/2;
                         ctx.moveTo(cx, cy - vOffset - 2);
                         ctx.lineTo(cx + hOffset + 2, cy + vOffset);
                         ctx.lineTo(cx - hOffset - 2, cy + vOffset);
                    } else if (i === 1) { // Square
                        ctx.rect(cx - iconSize/2, cy - iconSize/2, iconSize, iconSize);
                    } else if (i === 2) { // Circle
                        ctx.arc(cx, cy, iconSize/2 + 3, 0, Math.PI*2);
                    }
                    ctx.fill();

                    // Text Percentage below or to the side? The instruction was "underneath it" 
                    // in previous request, but visually it's often better inside if space permits, 
                    // or to the right. The original code put it to the right `cx + 25`.
                    // But now the donut is huge. Let's put it clearly to the right of the donut.
                    ctx.fillStyle = '#2e7d32';
                    ctx.font = "bold 24px Segoe UI"; // 3x bigger
                    ctx.textAlign = 'left';
                    ctx.fillText((predVal*100).toFixed(0) + "%", cx + 70, cy + 10);
                }
            }
        }
    },

    handleNodeClick(e, canvas) {
        const rect = canvas.getBoundingClientRect();
        // Handle CSS scaling vs Internal resolution
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        // Find clicked node
        const clicked = this.visualizerNodes.find(n => {
            const dx = n.x - mx;
            const dy = n.y - my;
            return Math.sqrt(dx*dx + dy*dy) < (n.r + 5);
        });

        if(clicked) {
            this.selectedNode = clicked;
            // Get weights connecting Previous Layer -> This Node
            const layerIdx = clicked.layerIndex;
            const weightsMatrix = this.nn.weights[layerIdx - 1]; // Weights from L(i-1) to L(i)
            
            const nodeIndex = clicked.nodeIndex;
            const weights = weightsMatrix.data[nodeIndex]; 

            // Visualization Strategy:
            // L1 (Hidden 1): Maps to Input (30x30 Image)
            // L2+: Maps to 1D vector of previous neurons. We can visualize as a 1D strip or grid.
            
            let isImage = (layerIdx === 1);
            this.drawWeightMap(weights, clicked, isImage);
        } else {
             // If clicked empty space, clear selection
             this.selectedNode = null;
             this.highlightedConnection = null;
             // Clear weight map canvases
             const wcvs = document.getElementById('weightMapCanvas');
             wcvs.getContext('2d').clearRect(0,0,wcvs.width,wcvs.height);
             const lcvs = document.getElementById('weightLegendCanvas');
             if(lcvs) lcvs.getContext('2d').clearRect(0,0,lcvs.width,lcvs.height);
             
             // Clear Donut
             this.drawWeightDonut(null);

             document.getElementById('weightMapLabel').textContent = "None Selected";
             this.renderNetworkGraph(document.getElementById('networkCanvas'));
        }
    },

    handleWeightMapHover(e) {
        if (!this.selectedNode || !this.selectedNode.weights) return;

        const canvas = document.getElementById('weightMapCanvas');
        const rect = canvas.getBoundingClientRect();
        
        // Mouse pos relative to canvas element (0..150)
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // Canvas resolution is fixed 150x150. CSS matches.
        // We need to map 0..150 back to logic grid logicW x logicH.
        // cellW = 150 / logicW
        
        const w = 150;
        const h = 150;
        if (mx < 0 || my < 0 || mx > w || my > h) return;

        const logicW = this.selectedNode.logicW;
        const logicH = this.selectedNode.logicH;

        const col = Math.floor(mx / (w / logicW));
        const row = Math.floor(my / (h / logicH));
        
        if (col < 0 || col >= logicW || row < 0 || row >= logicH) return;

        const index = row * logicW + col;
        const weightVal = this.selectedNode.weights[index];

        if (weightVal !== undefined) {
             // Update Label
             const label = document.getElementById('weightMapLabel');
             const which = this.selectedNode.layerIndex === 1 ? "(Spatial)" : "(Flat)";
             label.textContent = `Node L${this.selectedNode.layerIndex} #${this.selectedNode.nodeIndex} ${which} | Val: ${weightVal.toFixed(4)}`;

             // Update Highlight
             // We are looking at connection FROM index (in Layer L-1) TO this.selectedNode (in Layer L)
             this.highlightedConnection = {
                 layerIndex: this.selectedNode.layerIndex, // Connects L-1 -> L
                 targetIndex: this.selectedNode.nodeIndex, // Node in L
                 sourceIndex: index                        // Node in L-1
             };
             
             // Trigger re-render of graph to show line
             this.renderNetworkGraph(document.getElementById('networkCanvas'));

             // Update Legend Marker
             this.drawWeightLegend(weightVal);
             
             // Update Donut
             this.drawWeightDonut(weightVal);
        }
    },

    drawWeightDonut(weightVal) {
        const cvs = document.getElementById('weightDonutCanvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const valDiv = document.getElementById('weightDonutValue');
        
        // Update Text
        if (weightVal === null) {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            valDiv.textContent = "";
            return;
        }

        valDiv.textContent = weightVal.toFixed(4);

        const w = cvs.width;
        const h = cvs.height;
        const cx = w / 2;
        const cy = h / 2;
        const rOuter = (Math.min(w, h) / 2) - 10;
        const rInner = rOuter - 25;

        ctx.clearRect(0, 0, w, h);

        // Gauge Track
        // 0 is Top (-PI/2)
        // Max (+2) is -60 degrees (Top Right area). Angle from Top = +150 deg (5PI/6)
        // Min (-2) is 240 degrees (Bottom Left area). Angle from Top = -150 deg (-5PI/6)
        
        const topAngle = -Math.PI / 2;
        const range = 5 * Math.PI / 6; // 150 degrees
        
        const startTrack = topAngle - range;
        const endTrack = topAngle + range;

        // Draw Track (Gray Background)
        ctx.beginPath();
        // Outer Arc
        ctx.arc(cx, cy, rOuter, startTrack, endTrack); // Draws clockwise from min to max
        // Inner Arc (Reverse)
        ctx.arc(cx, cy, rInner, endTrack, startTrack, true); 
        ctx.closePath();
        ctx.fillStyle = '#eee';
        ctx.fill();

        // Draw Value Arc
        const val = Math.max(-2, Math.min(2, weightVal));
        const color = this.getWeightColor(val);
        
        // Calculate extent based on value fraction of 2.0
        // val=1 => angle = top + (1/2)*range
        // val=-1 => angle = top + (-1/2)*range
        const angleSpan = (val / 2.0) * range;
        const targetAngle = topAngle + angleSpan;

        ctx.beginPath();
        // Define arc points based on direction
        // If val > 0: Arc from Top to Target (Clockwise)
        // If val < 0: Arc from Top to Target (Counter-Clockwise)
        
        if (val >= 0) {
            ctx.arc(cx, cy, rOuter, topAngle, targetAngle);
            ctx.arc(cx, cy, rInner, targetAngle, topAngle, true);
        } else {
            // Negative: Draw from Target to Top to respect standard winding or just use ccw arg
            // arc(..., start, end, true) draws ccw from start to end
            // We want from Top(start) to Target(end) CCW? 
            ctx.arc(cx, cy, rOuter, topAngle, targetAngle, true);
            ctx.arc(cx, cy, rInner, targetAngle, topAngle, false);
        }
        
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
    },

    // New helper to draw the gradient legend
    drawWeightLegend(highlightVal = null) {
        const cvs = document.getElementById('weightLegendCanvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const W = cvs.width;
        const H = cvs.height;

        ctx.clearRect(0, 0, W, H);

        // Draw Gradient
        // Range -2 to 2
        for (let x = 0; x < W; x++) {
            // map x (0..W) to val (-2..2)
            const val = -2 + (x / W) * 4;
            
            // Logic from getWeightColor
            let r=0, g=0, b=0;
            // clamp for color calc just like main visualization
            // but we want to show the full range
            const tVal = Math.max(-2, Math.min(2, val));

            if (tVal < 0) {
                const t = Math.abs(tVal);
                r = Math.floor(255 * Math.min(1, t));
                b = Math.floor(255 * (1 - Math.min(1, t)));
            } else {
                const t = tVal;
                g = Math.floor(255 * Math.min(1, t));
                b = Math.floor(255 * (1 - Math.min(1, t)));
            }
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillRect(x, 0, 1, H);
        }

        // Draw Highlight Markers
        if (highlightVal !== null) {
            // Map value to x
            // x = (val - (-2)) / 4 * W
            // x = (val + 2) / 4 * W
            // clamp to canvas bounds
            const valClamped = Math.max(-2, Math.min(2, highlightVal));
            const x = ((valClamped + 2) / 4) * W;

            ctx.fillStyle = '#000';
            ctx.beginPath();
            
            // Top Triangle (pointing down)
            ctx.moveTo(x - 4, 0);
            ctx.lineTo(x + 4, 0);
            ctx.lineTo(x, 5);
            ctx.fill();

            // Bottom Triangle (pointing up)
            ctx.moveTo(x - 4, H);
            ctx.lineTo(x + 4, H);
            ctx.lineTo(x, H - 5);
            ctx.fill();
        }
    },

    drawWeightMap(weights, clickedNode, isImage) {
        const canvas = document.getElementById('weightMapCanvas');
        const label = document.getElementById('weightMapLabel');
        const ctx = canvas.getContext('2d');
        
        // Define minimum pixel blocks for visualization
        // The user wants each parameter "pixel" to be at least 5x5 physical pixels on the canvas
        // (Handled by strict 150x150 size vs small logic grid)

        // Resize canvas based on type
        let logicW, logicH;
        if(isImage) {
            logicW = 30;
            logicH = 30;
            label.textContent = `Node L${clickedNode.layerIndex} #${clickedNode.nodeIndex} (Spatial)`;
        } else {
            // Layout a small grid for non-spatial weights
            const cols = Math.ceil(Math.sqrt(weights.length));
            const rows = Math.ceil(weights.length / cols);
            logicW = cols;
            logicH = rows;
            label.textContent = `Node L${clickedNode.layerIndex} #${clickedNode.nodeIndex} (Flat)`;
        }
        
        // Store metadata for interactivity
        // We modify the clickedNode object provided by visualizer or a new stored ref
        if(!clickedNode.weights) { 
            // Better to update this.selectedNode directly since clickedNode might be ephemeral from finding
        }
        this.selectedNode.logicW = logicW;
        this.selectedNode.logicH = logicH;
        this.selectedNode.weights = weights;

        // Set Actual Canvas Size to be fixed 150x150
        canvas.width = 150;
        canvas.height = 150;


        const cellW = canvas.width / logicW;
        const cellH = canvas.height / logicH;

        // Use consistent color scale (Blue=0, Red=Neg, Green=Pos)
        // No normalization 'min-max' scaling, because we want to see absolute sign importance.
        // We assume weights are roughly within -2 to 2 range.
        
        for(let i=0; i < weights.length; i++) {
            const w = weights[i];
            
            // Re-use logic from getWeightColor but get raw RGB
            const val = Math.max(-2, Math.min(2, w));
            let r=0, g=0, b=0;
            if (val < 0) {
                const t = Math.abs(val);
                r = Math.floor(255 * Math.min(1, t));
                b = Math.floor(255 * (1 - Math.min(1, t)));
            } else {
                const t = val;
                g = Math.floor(255 * Math.min(1, t));
                b = Math.floor(255 * (1 - Math.min(1, t)));
            }
            
            // Draw rectangle for this weight
            const col = i % logicW;
            const row = Math.floor(i / logicW);
            
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            // Use Math.ceil to avoid sub-pixel gaps
            ctx.fillRect(col * cellW, row * cellH, cellW + 0.5, cellH + 0.5);
        }
        
        // Initial draw of legend
        this.drawWeightLegend(null);
    },

    setupChart() {
        const ctx = document.getElementById('lossChart').getContext('2d');
        Chart.defaults.color = '#666';
        Chart.defaults.borderColor = '#ddd';
        
        this.chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'MSE Loss',
                    data: [],
                    borderColor: '#2e7d32',
                    borderWidth: 1,
                    pointRadius: 0,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { title: { display: true, text: 'Epoch' }},
                    y: { title: { display: true, text: 'Loss' }, beginAtZero: true }
                }
            }
        });
    },

    updateChart(epoch, loss) {
        this.lossHistory.push({x: epoch, y: loss});
        this.chart.data.labels.push(epoch);
        this.chart.data.datasets[0].data.push(loss);
        this.chart.update();
    },

    /**
     * EVALUATION / DRAWING
     */
    setupDrawingCanvas() {
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // White background
        ctx.fillStyle = 'white';
        ctx.fillRect(0,0,300,300);

        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        canvas.addEventListener('mousedown', (e) => {
            this.isStaticEval = false; // Reset static flag on user interaction
            isDrawing = true;
            ctx.beginPath();
            const p = getPos(e);
            ctx.moveTo(p.x, p.y);
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('mousemove', (e) => {
            if(!isDrawing) return;
            this.isStaticEval = false; // Ensure cleared on draw
            canvas.style.border = '2px solid #ccc'; // Reset border
            const p = getPos(e);
            // Match relative thickness: Avg Training (2/30) = Drawing (20/300)
            ctx.lineWidth = 20; 
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'black';
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        });

        document.getElementById('btnClearDraw').addEventListener('click', () => {
             this.isStaticEval = false;
             canvas.style.border = '2px solid #ccc'; // Reset border
             ctx.fillStyle = 'white';
             ctx.fillRect(0,0,300,300);
             // Logic updatePrediction call isn't actually defined here? It likely failed before. 
        });
    },

    evalLoop() {
        // Run inference ~30fps
        const run = () => {
            if(!document.getElementById('evaluation').classList.contains('active')) return;
            
            // If static eval (test image result), don't update inference from canvas
            // But still need to keep the animation frame loop alive in case user clears/draws
            if (!this.isStaticEval) {
                const drawCanvas = document.getElementById('drawCanvas');
                
                // Downsample to 30x30
                // We use the shared helper canvas from DataGen for this
                const tempCtx = DataGen.ctx;

                // Ensure clean state before drawing
                tempCtx.globalCompositeOperation = 'source-over';
                tempCtx.fillStyle = 'white';
                tempCtx.fillRect(0, 0, 30, 30);
                tempCtx.imageSmoothingEnabled = true; // Ensure smoothing for downsampling
                tempCtx.imageSmoothingQuality = 'high';

                tempCtx.drawImage(drawCanvas, 0, 0, 30, 30);

                // Show on UI Input Canvas
                const inputCanvas = document.getElementById('inputCanvas');
                const inputCtx = inputCanvas.getContext('2d');
                inputCtx.clearRect(0,0,30,30);
                inputCtx.drawImage(DataGen.canvas, 0, 0);

                const imgData = tempCtx.getImageData(0,0,30,30);
                
                // Flatten
                const input = [];
                for(let i=0; i<imgData.data.length; i+=4) {
                    // Invert input for light theme logic (White=0, Black=1)
                    input.push(1 - (imgData.data[i]/255));
                }
                
                const output = this.nn.feedForward(input);
                this.renderNetworkGraph(document.getElementById('liveNetworkCanvas'), output);
            }
            
            this.evalReqId = requestAnimationFrame(run);
        };
        run();
    },

    updatePrediction(output) {
        const setDonut = (id, valId, val) => {
            const pct = (val * 100).toFixed(1);
            document.getElementById(valId).textContent = pct + '%';
            
            // Conic Gradient for Donut Chart
            // Green (Accent) for value, Light Gray for track
            const donut = document.getElementById(id);
            // Use CSS var via JS or literal color
            const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2e7d32';
            donut.style.background = `conic-gradient(${accent} ${pct}%, #eee 0deg)`;
        };
        setDonut('donutTri', 'valTri', output[0]);
        setDonut('donutSqr', 'valSqr', output[1]);
        setDonut('donutCir', 'valCir', output[2]);
    }
};

// Start
App.init();

</script>
